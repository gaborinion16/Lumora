name: 'Build Lumora for macOS'

# Builds an unsigned Lumora installer (.pkg) on GitHub's macOS runners,
# so no local Xcode or Qt install is needed. Download it from the run's
# "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  QT_VERSION: 6.10.1
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
    - name: Get sources
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: Install Conan and Ninja
      run: |
        pip install "conan==2.28.0"
        brew list ninja >/dev/null 2>&1 || brew install ninja

    - name: Build app and installer
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      shell: bash
      run: |
        set -o pipefail
        deploy/build.sh --generator Ninja --installer productbuild 2>&1 | tee "$RUNNER_TEMP/build.log"

    # Surface the build errors as annotations, so they can be read through
    # the GitHub API without downloading the full log.
    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        log="$RUNNER_TEMP/build.log"
        [ -f "$log" ] || exit 0
        enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
        errs=$(grep -nE "error:|CMake Error|FAILED:|fatal:|ERROR:|Error [0-9]+|No such file" "$log" | grep -v -- "-Werror" | head -40 | cut -c1-400 | enc)
        [ -n "$errs" ] && echo "::error title=Build errors::${errs}"
        grep -vE "warning|^\s*$|note:|\^|~~~" "$log" | tail -n 60 | cut -c1-240 > "$RUNNER_TEMP/tail.txt"
        head -n 20 "$RUNNER_TEMP/tail.txt" | enc | sed 's/^/::error title=Log tail 1 of 3::/'; echo
        sed -n 21,40p "$RUNNER_TEMP/tail.txt" | enc | sed 's/^/::error title=Log tail 2 of 3::/'; echo
        sed -n 41,60p "$RUNNER_TEMP/tail.txt" | enc | sed 's/^/::error title=Log tail 3 of 3::/'; echo

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Lumora-macOS-installer
        path: deploy/build/*.pkg
        if-no-files-found: error
        retention-days: 30
