name: 'Build Lumora for macOS'

# Builds Lumora.app (ad-hoc signed) on GitHub's macOS runners and zips it
# with install.sh, so no local Xcode or Qt install is needed.
# Download it from the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  QT_VERSION: 6.10.1
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
    - name: Get sources
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: Install Conan and Ninja
      run: |
        pip install "conan==2.28.0"
        brew list ninja >/dev/null 2>&1 || brew install ninja

    - name: Build app
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      shell: bash
      run: |
        set -o pipefail
        deploy/build.sh --generator Ninja 2>&1 | tee "$RUNNER_TEMP/build.log"

    # Surface the build errors as annotations, so they can be read through
    # the GitHub API without downloading the full log.
    - name: Report build errors
      if: failure()
      shell: bash
      run: |
        log="$RUNNER_TEMP/build.log"
        [ -f "$log" ] || exit 0
        enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
        errs=$(grep -nE "error:|CMake Error|FAILED:|fatal:|ERROR:|Error [0-9]+|No such file" "$log" | grep -v -- "-Werror" | head -40 | cut -c1-400 | enc)
        [ -n "$errs" ] && echo "::error title=Build errors::${errs}"
        grep -vE "warning|^\s*$|note:|\^|~~~" "$log" | tail -n 60 | cut -c1-240 > "$RUNNER_TEMP/tail.txt"
        head -n 20 "$RUNNER_TEMP/tail.txt" | enc | sed 's/^/::error title=Log tail 1 of 3::/'; echo
        sed -n 21,40p "$RUNNER_TEMP/tail.txt" | enc | sed 's/^/::error title=Log tail 2 of 3::/'; echo
        sed -n 41,60p "$RUNNER_TEMP/tail.txt" | enc | sed 's/^/::error title=Log tail 3 of 3::/'; echo
        pblog=$(find deploy/build/_CPack_Packages -name ProductBuildOutput.log 2>/dev/null | head -1)
        if [ -n "$pblog" ]; then
          grep -v "^\s*$" "$pblog" | tail -n 30 | cut -c1-240 | enc | sed 's/^/::error title=pkgbuild log::/'; echo
        fi

    # Install into a staging folder (this runs macdeployqt, bundling Qt into
    # the app), rename it Lumora.app, ad-hoc sign it so Apple Silicon Macs
    # will launch it, and zip it with the install scripts.
    - name: Package the app
      shell: bash
      run: |
        set -e
        stage="$RUNNER_TEMP/stage"
        cmake --install deploy/build --prefix "$stage" 2>&1 | tail -20
        app=$(find "$stage" -name "AmneziaVPN.app" -type d -prune | head -1)
        echo "App bundle: $app"
        test -n "$app"
        out="$RUNNER_TEMP/out/Lumora"
        mkdir -p "$out"
        ditto "$app" "$out/Lumora.app"
        cp deploy/data/macos/AmneziaVPN.plist "$out/Lumora.app/Contents/Resources/" 2>/dev/null || true
        codesign --force --deep --sign - "$out/Lumora.app"
        codesign --verify --deep --strict "$out/Lumora.app" && echo "signature ok"
        cp deploy/data/macos/lumora/install.sh deploy/data/macos/lumora/uninstall.sh "$out/"
        chmod +x "$out/"*.sh
        (cd "$RUNNER_TEMP/out" && ditto -c -k --keepParent Lumora Lumora-macOS.zip)
        ls -la "$RUNNER_TEMP/out"

    - name: Upload app
      uses: actions/upload-artifact@v4
      with:
        name: Lumora-macOS
        path: ${{ runner.temp }}/out/Lumora-macOS.zip
        if-no-files-found: error
        retention-days: 30
